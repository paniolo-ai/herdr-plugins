id = "paniolo-herdr-devin"
name = "Paniolo Herdr Devin"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Per-thread status footer for Devin CLI panes: model, context %, quota windows, spend, session tokens, dirty repos."
platforms = ["windows", "macos", "linux"]

[[startup]]
command = ["node", "startup.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "event.mjs"]

[[events]]
on = "pane.exited"
command = ["node", "event.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "event.mjs"]

[[panes]]
id = "footer"
title = "Devin status"
placement = "split"
command = ["node", "footer.mjs"]

[[actions]]
id = "reconcile"
title = "Provision/repair devin footers now"
contexts = ["workspace"]
command = ["node", "reconcile.mjs"]
